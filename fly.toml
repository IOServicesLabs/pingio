app = 'pingio-relay'
primary_region = 'iad'

[build]
dockerfile = 'infrastructure/docker/Dockerfile.relay'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.ports]]
handlers = ['http']
port = 80
force_https = true

[[http_service.ports]]
handlers = ['tls']
port = 443

[env]
NODE_ENV = 'production'
PORT = '3000'
HOST = '0.0.0.0'
AUTH_MODE = 'central'
CENTRAL_AUTH_ISSUER = 'https://pingio-auth.fly.dev'
CENTRAL_AUTH_AUDIENCE = 'pingio-relay'
RELAY_ID = ''
TRUST_PROXY = 'true'
CORS_ORIGIN = 'false'
# DEVICE_VERIFICATION_REQUIRED / MAX_DEVICES_PER_USER / token expiries are
# enforced by pingio-auth (see fly.auth.toml) — setting them here is a no-op.

# Provision Postgres and Redis separately, then attach:
#   fly postgres create --name pingio-db
#   fly postgres attach --app pingio-relay pingio-db
#   fly redis create --name pingio-redis
#   fly secrets set --app pingio-relay REDIS_URL=<redis-url>
