apiVersion: v1
kind: Secret
metadata:
  name: pingio-secrets
type: Opaque
stringData:
  database-url: "postgresql://user:password@postgres:5432/pingio"
  redis-url: "redis://redis:6379"
  # Placeholder — the relay refuses to boot in production with known-insecure
  # values. Generate a real one: openssl rand -base64 32
  jwt-secret: "your-secret-key-change-in-production"
