# Relay server deployment for Pingio (AUTH_MODE=local by default).
#
# NOTE: there is intentionally no auth-server manifest here yet — these
# manifests only cover a self-contained relay. For a central-auth deployment
# you'd also need a Deployment/Service/Ingress for `pingio/auth-server:latest`
# on port 3001 plus AUTH_MODE=central + CENTRAL_AUTH_ISSUER on this relay.
#
# The image below is a placeholder — build and push your own, e.g.:
#   docker build -f infrastructure/docker/Dockerfile.relay -t <registry>/pingio-relay:<tag> .
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingio-relay
  labels:
    app: pingio-relay
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pingio-relay
  template:
    metadata:
      labels:
        app: pingio-relay
    spec:
      containers:
      - name: relay
        image: pingio/relay-server:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pingio-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: pingio-secrets
              key: redis-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pingio-secrets
              key: jwt-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: pingio-relay
  labels:
    app: pingio-relay
spec:
  selector:
    app: pingio-relay
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pingio-relay
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
  - hosts:
    - relay.example.com
    secretName: pingio-relay-tls
  rules:
  - host: relay.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pingio-relay
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pingio-relay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pingio-relay
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
