version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pingio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_DB: ${POSTGRES_DB:-pingio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pingio} -d ${POSTGRES_DB:-pingio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.auth
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-pingio}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-pingio}
      ISSUER: ${AUTH_ISSUER:-https://auth.pingio.io}
      AUDIENCE: ${AUTH_AUDIENCE:-pingio-relay}
      RELAY_ID: ${RELAY_ID:-}
      RELAY_URL: ${RELAY_URL:-wss://relay.pingio.io/ws}
      TRUST_PROXY: 'true'
      # Federation control plane (relay node registry). Unset bootstrap token =
      # open registration to anyone (auth server warns at boot).
      FEDERATION_BOOTSTRAP_TOKEN: ${FEDERATION_BOOTSTRAP_TOKEN:-}
      FEDERATION_ADMIN_TOKEN: ${FEDERATION_ADMIN_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-false}
      # Enforced by the auth server (central mode) — not by the relay.
      DEVICE_VERIFICATION_REQUIRED: ${DEVICE_VERIFICATION_REQUIRED:-true}
      MAX_DEVICES_PER_USER: ${MAX_DEVICES_PER_USER:-5}
      ACCESS_TOKEN_EXPIRY_MINUTES: ${ACCESS_TOKEN_EXPIRY_MINUTES:-60}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-30}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 (not localhost): Node binds 0.0.0.0 (IPv4-only) via HOST, while
      # alpine wget resolves localhost to ::1 first and gets connection refused.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  relay:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.relay
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-pingio}:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/${POSTGRES_DB:-pingio}
      REDIS_URL: redis://redis:6379
      AUTH_MODE: central
      CENTRAL_AUTH_ISSUER: ${AUTH_ISSUER:-https://auth.pingio.io}
      CENTRAL_AUTH_AUDIENCE: ${AUTH_AUDIENCE:-pingio-relay}
      RELAY_ID: ${RELAY_ID:-}
      TRUST_PROXY: 'true'
      CORS_ORIGIN: ${CORS_ORIGIN:-false}
      # NOTE: DEVICE_VERIFICATION_REQUIRED / MAX_DEVICES_PER_USER / token
      # expiries are enforced by the auth service in central mode — setting
      # them on the relay is a no-op.
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.pingio.io}
      RELAY_DOMAIN: ${RELAY_DOMAIN:-relay.pingio.io}
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      relay:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
